<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Lesser Known Imams — Unveiling the Lives & Legacies of the Ahlul Bayt (as). Coming Soon.">
  <title>The Lesser Known Imams (as) — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C8A96A;
      --gold-light: #C8A96A33;
      --gold-dark: #b89a55;
      --crimson: #8B1A1A;
      --bg: #0d0d0d;
      --bg-card: #161616;
      --text: #aaaaaa;
      --text-dim: #666;
      --text-faint: #444;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }

    body::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(200,169,106,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .container { text-align: center; padding: 40px 24px; position: relative; z-index: 1; max-width: 480px; }

    .logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; background: var(--bg); margin: 0 auto 24px; position: relative; animation: breathe 4s ease-in-out infinite; }
    .logo::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 1px solid var(--gold-light); opacity: 0.3; animation: pulse-ring 3s ease-in-out infinite; }
    .logo-inner { width: 64px; height: 64px; border-radius: 50%; background: var(--crimson); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(139,26,26,0.3); }
    .logo-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--gold); opacity: 0.85; box-shadow: 0 0 20px rgba(200,169,106,0.35); }

    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    @keyframes pulse-ring { 0%,100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.06); opacity: 0.1; } }

    .badge { font-size: 9px; color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 16px; opacity: 0.8; }
    .title { font-size: 24px; font-weight: 500; color: var(--gold); font-family: var(--font-serif); line-height: 1.3; margin-bottom: 8px; }
    .arabic { font-size: 14px; color: var(--crimson); direction: rtl; margin-bottom: 8px; line-height: 1.6; }

    .divider { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--gold); font-size: 11px; margin: 20px 0; opacity: 0.5; }
    .divider-line { width: 60px; height: 0.5px; background: linear-gradient(90deg, transparent, var(--gold)); }
    .divider-line.rev { background: linear-gradient(90deg, var(--gold), transparent); }

    .subtitle { font-size: 14px; color: var(--text); line-height: 1.7; margin-bottom: 32px; }
    .subtitle em { font-style: normal; color: var(--gold); opacity: 0.85; }

    .cta { display: inline-block; background: var(--gold); color: var(--bg); font-size: 13px; font-weight: 500; padding: 12px 28px; border-radius: 3px; text-decoration: none; transition: background 0.25s, transform 0.25s, box-shadow 0.25s; }
    .cta:hover { background: var(--gold-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,169,106,0.25); }

    .footer-note { margin-top: 40px; font-size: 10px; color: var(--text-dim); }
    .footer-note a { color: var(--gold); opacity: 0.6; text-decoration: none; transition: opacity 0.2s; }
    .footer-note a:hover { opacity: 1; }

    @media (max-width: 400px) {
      .logo { width: 80px; height: 80px; }
      .logo-inner { width: 50px; height: 50px; }
      .logo-dot { width: 24px; height: 24px; }
      .title { font-size: 20px; }
      .subtitle { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-inner">
        <div class="logo-dot"></div>
      </div>
    </div>
    <div class="badge">السلام عليكم يا أهل بيت النبوة</div>
    <h1 class="title">The Lesser Known Imams (as)</h1>
    <p class="arabic">وَمَن يُعَظِّمْ شَعَائِرَ اللَّهِ</p>
    <div class="divider">
      <span class="divider-line"></span>
      <span>◈</span>
      <span class="divider-line rev"></span>
    </div>
    <p class="subtitle">Unveiling the lives & legacies of the <em>Ahlul Bayt</em>.<br>We're building something meaningful — coming soon.</p>
    <a href="https://chat.whatsapp.com/GLehgiD3m7d7w3pOgBCcWZ" target="_blank" rel="noopener" class="cta">Join WhatsApp Community</a>
    <p class="footer-note">Made with love for the Ahlul Bayt · <a href="mailto:contact@thelesserknownimams.com">Contact</a></p>
  </div>
</body>
</html>
