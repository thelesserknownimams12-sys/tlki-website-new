<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lesser Known Imams (as) – Coming Soon</title>
    <link rel="icon" type="image/jpeg" href="assets/tlki-logo.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            font-size: 20px;
        }

        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(139, 26, 26, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 48px 32px;
            max-width: 760px;
            width: 100%;
        }

        .logo-wrapper {
            margin-bottom: 44px;
        }

        .logo-wrapper img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #C8A96A;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(200, 169, 106, 0.18);
        }

        h1 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 2.8rem;
            font-weight: 400;
            color: #C8A96A;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 44px;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(to right, transparent, #C8A96A, transparent);
            margin: 0 auto 44px;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 30px;
            line-height: 2;
            color: #8B1A1A;
            direction: rtl;
            margin-bottom: 18px;
            text-shadow: 0 0 20px rgba(139, 26, 26, 0.3);
        }

        .arabic-translation {
            font-size: 18px;
            color: #999;
            font-style: italic;
            margin-bottom: 52px;
            line-height: 1.7;
        }

        .arabic-translation em {
            color: #C8A96A;
            font-style: normal;
        }

        .coming-soon-box {
            margin-bottom: 44px;
        }

        .coming-soon-text {
            font-size: 1.6rem;
            color: #C8A96A;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 300;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #25D366;
            color: #0d0d0d;
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(37, 211, 102, 0.25);
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 32px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn svg {
            width: 24px;
            height: 24px;
            fill: #0d0d0d;
        }

        footer {
            position: absolute;
            bottom: 28px;
            text-align: center;
            width: 100%;
            font-size: 1rem;
            color: #555;
            letter-spacing: 1px;
        }

        footer span {
            color: #C8A96A;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            .arabic-text {
                font-size: 24px;
                line-height: 1.8;
            }
            .coming-soon-text {
                font-size: 1.3rem;
                letter-spacing: 5px;
            }
            .logo-wrapper img {
                width: 110px;
                height: 110px;
            }
            .subtitle {
                font-size: 0.9rem;
            }
            .arabic-translation {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="logo-wrapper">

        </div>
        <h1>The Lesser Known Imams (as)</h1>
        <p class="subtitle">Coming Soon</p>
        <div class="divider"></div>
        <div class="arabic-text">
            وَأَكْرَمَ أَنْفُسَكُمْ وَأَعْظَمَ شَأْنَكُمْ
        </div>
        <p class="arabic-translation">
            "How noble your souls are! How superior your affairs are!" – <em>Ziarat e Jameah Kabeerah</em>
        </p>
        <div class="coming-soon-box">
            <p class="coming-soon-text">Coming Soon</p>
        </div>

</body>
</html>
